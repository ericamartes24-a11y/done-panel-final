<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEGA</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}body{background:#0f172a}.view{display:none;min-height:100vh}.view.active{display:flex!important}.momoLayout{display:flex;min-height:100vh;width:100%;background:#0f172a}.momoSidebar{width:260px;background:#0b1120;border-right:1px solid #1e293b;padding:18px;display:flex;flex-direction:column}.momoMain{flex:1;padding:26px}.momoMenu button{width:100%;text-align:left;display:flex;gap:10px;padding:12px 14px;border-radius:10px;color:#64748b;background:transparent;border:0;font-size:14px;font-weight:600;cursor:pointer}.momoMenu button.active{background:#e91e8c;color:white}.momoH1{font-size:22px;color:#fbbf24;font-weight:800}.card{background:#111a2e;border:1px solid #1e293b;border-radius:14px;padding:18px}</style></head><body>
<div id="vPanel" class="view active"><div class="momoLayout"><div class="momoSidebar"><div class="momoMenu"><button class="active" onclick="window.showView('vPanel')">◫ Panel de Control</button><button onclick="window.showView('vControlar')">⚡ Controlar anuncios</button><button onclick="window.showView('vPerfil')">◍ Mi Perfil</button></div></div><div class="momoMain"><div class="momoH1">Panel de Control</div><div class="card" style="margin-top:20px">Bumps hoy: 0 - Sistema estable</div></div></div></div>
<div id="vControlar" class="view"><div class="momoLayout"><div class="momoSidebar"><div class="momoMenu"><button onclick="window.showView('vPanel')">◫ Panel de Control</button><button class="active">⚡ Controlar anuncios</button><button onclick="window.showView('vPerfil')">◍ Mi Perfil</button></div></div><div class="momoMain"><div class="momoH1">Controlar mis anuncios</div><div style="display:flex;gap:10px;margin:20px 0"><button style="background:#132a1f;border:1px solid #14532d;color:#4ade80;border-radius:999px;padding:10px 20px;font-weight:700">▷ Iniciar todos</button><button style="background:#211a08;border:1px solid #78350f;color:#fbbf24;border-radius:999px;padding:10px 20px;font-weight:700">II Pausar todos</button><button style="background:#e91e8c;border:0;color:white;border-radius:999px;padding:10px 20px;font-weight:700">I Subir todos</button></div><div class="card" style="max-width:520px"><div style="display:flex;justify-content:space-between"><span style="color:#fbbf24;font-weight:700">Sin anuncios aún</span><span style="background:#0f172a;border:1px solid #1e293b;color:#64748b;border-radius:999px;padding:4px 10px;font-size:10px">Esperando bot</span></div><div style="font-size:11px;color:#94a3b8;margin-top:10px">El bot aún no ha creado anuncios. Cuando crees un anuncio en el bot, aparecerá aquí.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;background:#0b1120;border:1px solid #1e293b;border-radius:10px;padding:14px;margin-top:14px"><div><div style="font-size:10px;color:#475569">Bumps hoy</div><div style="width:24px;height:24px;background:#fbbf24;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900">0</div></div><div><div style="font-size:10px;color:#475569">Próximo</div><div style="color:#64748b">—</div></div></div></div></div></div></div>
<div id="vPerfil" class="view"><div class="momoLayout"><div class="momoSidebar"><div class="momoMenu"><button onclick="window.showView('vPanel')">◫ Panel</button><button onclick="window.showView('vControlar')">⚡ Anuncios</button><button class="active">◍ Mi Perfil</button></div></div><div class="momoMain"><div class="momoH1">Mi Perfil</div><div class="card" style="margin-top:20px">Usuario: ericamartes24-a11y<br>Plan MEGA - Mirror LIVE</div></div></div></div>
<script>window.showView=function(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');console.log('cambiando a',id)};</script></body></html>
